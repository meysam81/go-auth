name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  GO_VERSION: "1.24"

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum', '**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install dependencies
        run: go mod download
      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
      # F-23: three packages shipped at 0.0 % coverage. The floors in
      # .coverage-floor are a ratchet -- a package may climb, never slide back.
      # The gate reads the file rather than hardcoding, so raising a floor after
      # new tests land is a data change.
      #
      # It fails closed in three directions, because a gate that can only report
      # "ok" is not a gate: a package BELOW its floor fails, a package with NO
      # floor recorded fails (an ungated package is indistinguishable from one at
      # 0 %), and a floor whose package produced no coverage rows at all fails --
      # that is what a suite silently dropping out of the build looks like.
      - name: Enforce per-package coverage floor
        run: |
          cat > /tmp/coverage-floor.awk <<'AWK'
          FNR == NR {
            if ($0 ~ /^[[:space:]]*(#|$)/) next
            floor[$1] = $2 + 0
            order[++nfloor] = $1
            next
          }
          /^mode:/ { next }
          {
            path = $1
            sub(/:[0-9]+\.[0-9]+,[0-9]+\.[0-9]+$/, "", path)
            sub("^" module "/", "", path)
            slash = 0
            for (i = length(path); i > 0; i--) {
              if (substr(path, i, 1) == "/") { slash = i; break }
            }
            pkg = (slash > 0) ? substr(path, 1, slash - 1) : "."
            total[pkg] += $2
            if ($3 > 0) covered[pkg] += $2
            seen[pkg] = 1
          }
          END {
            fail = 0
            for (i = 1; i <= nfloor; i++) {
              pkg = order[i]
              if (!(pkg in seen)) {
                printf "FAIL  %-18s   ----   recorded in .coverage-floor but absent from the profile: the package was renamed or removed, or its tests stopped being built\n", pkg
                fail = 1
                continue
              }
              pct = (total[pkg] > 0) ? covered[pkg] * 100.0 / total[pkg] : 0.0
              if (pct + 0.05 < floor[pkg]) {
                printf "FAIL  %-18s %6.1f%%  below floor %d%%\n", pkg, pct, floor[pkg]
                fail = 1
              } else {
                printf "ok    %-18s %6.1f%%  floor %d%%\n", pkg, pct, floor[pkg]
              }
            }
            for (pkg in seen) {
              if (!(pkg in floor)) {
                pct = (total[pkg] > 0) ? covered[pkg] * 100.0 / total[pkg] : 0.0
                printf "FAIL  %-18s %6.1f%%  no floor recorded; add it to .coverage-floor\n", pkg, pct
                fail = 1
              }
            }
            exit fail
          }
          AWK
          if ! awk -v module="$(go list -m)" -f /tmp/coverage-floor.awk \
            .coverage-floor coverage.txt; then
            echo "::error::the per-package coverage gate failed; see the FAIL lines above and .coverage-floor"
            exit 1
          fi
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.txt
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  checks:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum', '**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Run go vet
        run: go vet ./...
      - name: Run go fmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files must be formatted with gofmt. Please run:"
            echo "  gofmt -w ."
            exit 1
          fi
      # Pinned to the version .golangci.yml was verified against with
      # `golangci-lint config verify`; older v2 minors do not know every setting
      # the config uses, and an unparsable config is a linter that does nothing.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          args: --timeout=5m

  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum', '**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Build library
        run: go build -v ./...

  # F-23: govulncheck was absent from CI, so a known-vulnerable transitive
  # dependency could ship in a release of a security library.
  govulncheck:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum', '**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  # docs/security-hardening.md §6: fuzz targets cover every parser and decoder
  # that touches untrusted input. A short bounded budget per target keeps this a
  # regression gate on the checked-in corpus rather than a discovery run.
  fuzz:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum', '**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Fuzz every target for a bounded budget
        run: |
          set -euo pipefail
          found=0
          for pkg in $(go list ./...); do
            # -list compiles the package, so a broken test build still fails the
            # job; a package with no fuzz target simply yields no matches.
            targets="$(go test -list='^Fuzz' "$pkg" | { grep '^Fuzz' || true; })"
            for target in $targets; do
              found=$((found + 1))
              echo "::group::fuzz $pkg $target"
              # go test refuses -fuzz when the pattern matches more than one
              # target, so each is anchored and run on its own.
              go test -run='^$' -fuzz="^${target}$" -fuzztime=30s "$pkg"
              echo "::endgroup::"
            done
          done
          # Without this the job passes when there is nothing to fuzz, so
          # deleting every target -- or a refactor that renames the file they
          # live in -- would read as a green fuzz gate. docs/security-hardening.md
          # §6 requires a target on every parser that reads untrusted input, and
          # zero is never the right answer for this repository.
          if [ "$found" -eq 0 ]; then
            echo "::error::no fuzz targets were found; the fuzz gate certified nothing"
            exit 1
          fi
          echo "fuzzed $found target(s)"

  # F-23: examples/complete is a separate module with a `replace` back to the
  # repo root, so it is not covered by the root build and an API change rots it
  # silently. `go mod tidy` first: this module tracks the parent through the
  # replace, and the signal worth failing on is the compile, not version drift.
  build-examples:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum', '**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Build examples/complete
        working-directory: examples/complete
        run: |
          set -euo pipefail
          go mod tidy
          go build -v ./...
          go vet ./...
      - name: Report dependency drift in examples/complete
        working-directory: examples/complete
        run: |
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::notice::examples/complete go.mod/go.sum are stale; run 'go mod tidy' there and commit the result"
            git --no-pager diff -- go.mod go.sum
          fi

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - id: release-please
        name: Release please
        uses: googleapis/release-please-action@v4
        with:
          release-type: go
