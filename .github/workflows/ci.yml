name: ci

# `v2` carries the v2 module until `v2.0.0`, when it merges into `main`
# (docs/v2-design.md §11); its pull requests, pushes and releases run here too.
on:
  pull_request:
    branches:
      - main
      - v2
    # `edited` re-runs the checks when the title changes: the title is what
    # pr-title and api-diff read. It also fires on body edits, which costs a
    # full run each time; skipping the other jobs on `edited` would let a run
    # that tested nothing replace the last real result of ci-gate.
    types:
      - opened
      - synchronize
      - reopened
      - edited
  push:
    branches:
      - main
      - v2
  # Dormant: GitHub offers merge queues only to organization-owned public
  # repositories, and this one is owned by a user (docs/ci.md). The trigger
  # stays so a queue works the day the repository can have one; a required
  # check must report on `merge_group` or a queued pull request never merges.
  merge_group:
    types:
      - checks_requested

# No job inherits a token scope it did not ask for: each declares its own.
permissions: {}

env:
  # The commit types release-please-config.json knows; pr-title and api-diff
  # read the pull request title against this list.
  CONVENTIONAL_TYPES: feat|fix|perf|revert|build|deps|chore|ci|docs|refactor|test|style

# Each pull request and each ref gets its own concurrency group. A pull
# request's superseded run is cancelled, since only its latest commit can merge;
# push runs are never cancelled, because that can abort a release-please run
# mid-flight, and neither are merge-group runs, should a queue ever exist,
# because a cancelled one reports a failed check back to the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Twice: on the oldest Go that go.mod admits, which is the floor every
  # consumer is promised, and on the newest release, which is what most of them
  # build with. A use of a newer standard-library API fails the first; a
  # toolchain change fails the second. -shuffle=on randomises test order, so a
  # test that only passes after another one has run is caught here.
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: [go.mod, stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
      - name: Install dependencies
        run: go mod download
      - name: Run tests
        run: go test -v -race -shuffle=on -coverprofile=coverage.txt -covermode=atomic ./...
      # F-23: three packages shipped at 0.0 % coverage. The floors in
      # .coverage-floor are a ratchet -- a package may climb, never slide back.
      # The gate reads the file rather than hardcoding, so raising a floor after
      # new tests land is a data change.
      #
      # It fails closed in three directions, because a gate that can only report
      # "ok" is not a gate: a package BELOW its floor fails, a package with NO
      # floor recorded fails (an ungated package is indistinguishable from one at
      # 0 %), and a floor whose package produced no coverage rows at all fails --
      # that is what a suite silently dropping out of the build looks like.
      # The floor is measured once, on the go.mod leg; the two legs run the same
      # tests, so a second measurement adds nothing but a second upload.
      - name: Enforce per-package coverage floor
        if: matrix.go == 'go.mod'
        run: |
          cat > /tmp/coverage-floor.awk <<'AWK'
          FNR == NR {
            if ($0 ~ /^[[:space:]]*(#|$)/) next
            floor[$1] = $2 + 0
            order[++nfloor] = $1
            next
          }
          /^mode:/ { next }
          {
            path = $1
            sub(/:[0-9]+\.[0-9]+,[0-9]+\.[0-9]+$/, "", path)
            sub("^" module "/", "", path)
            slash = 0
            for (i = length(path); i > 0; i--) {
              if (substr(path, i, 1) == "/") { slash = i; break }
            }
            pkg = (slash > 0) ? substr(path, 1, slash - 1) : "."
            total[pkg] += $2
            if ($3 > 0) covered[pkg] += $2
            seen[pkg] = 1
          }
          END {
            fail = 0
            for (i = 1; i <= nfloor; i++) {
              pkg = order[i]
              if (!(pkg in seen)) {
                printf "FAIL  %-18s   ----   recorded in .coverage-floor but absent from the profile: the package was renamed or removed, or its tests stopped being built\n", pkg
                fail = 1
                continue
              }
              pct = (total[pkg] > 0) ? covered[pkg] * 100.0 / total[pkg] : 0.0
              if (pct + 0.05 < floor[pkg]) {
                printf "FAIL  %-18s %6.1f%%  below floor %d%%\n", pkg, pct, floor[pkg]
                fail = 1
              } else {
                printf "ok    %-18s %6.1f%%  floor %d%%\n", pkg, pct, floor[pkg]
              }
            }
            for (pkg in seen) {
              if (!(pkg in floor)) {
                pct = (total[pkg] > 0) ? covered[pkg] * 100.0 / total[pkg] : 0.0
                printf "FAIL  %-18s %6.1f%%  no floor recorded; add it to .coverage-floor\n", pkg, pct
                fail = 1
              }
            }
            exit fail
          }
          AWK
          if ! awk -v module="$(go list -m)" -f /tmp/coverage-floor.awk \
            .coverage-floor coverage.txt; then
            echo "::error::the per-package coverage gate failed; see the FAIL lines above and .coverage-floor"
            exit 1
          fi
      - name: Upload coverage to Codecov
        if: matrix.go == 'go.mod'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage.txt
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  checks:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # Formatting is enforced here rather than on pre-commit.ci, whose sandbox
      # has no bun to run it with. Pinned so a prettier release cannot turn a
      # green branch red on its own; bump it alongside the pre-commit hook.
      - name: Check formatting of docs and workflows
        run: npx --yes prettier@3.9.6 --check .
      - name: Run go vet
        run: go vet ./...
      # A go.mod or go.sum that `go mod tidy` would change is a dependency
      # change nobody reviewed, or a go.sum line nothing needs.
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      # See .github/dependency-footprint.sh for why the indirect half matters.
      - name: The dependency footprint is unchanged
        run: |
          want=$(.github/dependency-footprint.sh)
          if ! diff -u .dependency-footprint <(printf '%s\n' "$want"); then
            echo "::error::the packages this module compiles in changed; run \`.github/dependency-footprint.sh > .dependency-footprint\` and review the added lines"
            exit 1
          fi
      - name: Run go fmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files must be formatted with gofmt. Please run:"
            echo "  gofmt -w ."
            exit 1
          fi
      # Pinned to the version .golangci.yml was verified against with
      # `golangci-lint config verify`; older v2 minors do not know every setting
      # the config uses, and an unparsable config is a linter that does nothing.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.11
          args: --timeout=5m

  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build library
        run: go build -v ./...

  # F-23: govulncheck was absent from CI, so a known-vulnerable transitive
  # dependency could ship in a release of a security library.
  govulncheck:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Deliberately NOT go.mod. The standard-library half of the report is only
      # meaningful against a current toolchain: scanning with an old Go reports
      # every stdlib advisory fixed since, which is noise about the scanner
      # rather than signal about this code.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      # Pinned: `@latest` let an upstream release change what this gate runs
      # without a commit here. Renovate bumps the pin (the comment is its
      # marker) once a release is 14 days old, the repository-wide cooldown;
      # scheduled.yml carries the same pin and is bumped with it.
      - name: Install govulncheck
        env:
          # renovate: go=golang.org/x/vuln
          GOVULNCHECK_VERSION: v1.8.0
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - name: Run govulncheck
        run: govulncheck ./...

  # docs/security-hardening.md §6: the fuzz targets cover the WebAuthn ceremony
  # decoders, which are the parsers reachable with attacker-controlled bytes
  # before any credential is verified. Each target gets a bounded 30 s
  # discovery run from its seed corpus; the seeds themselves (added with f.Add)
  # run as ordinary tests in the test job.
  fuzz:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Fuzz every target for a bounded budget
        run: |
          set -euo pipefail
          found=0
          for pkg in $(go list ./...); do
            # -list compiles the package, so a broken test build still fails the
            # job; a package with no fuzz target simply yields no matches.
            targets="$(go test -list='^Fuzz' "$pkg" | { grep '^Fuzz' || true; })"
            for target in $targets; do
              found=$((found + 1))
              echo "::group::fuzz $pkg $target"
              # go test refuses -fuzz when the pattern matches more than one
              # target, so each is anchored and run on its own.
              go test -run='^$' -fuzz="^${target}$" -fuzztime=30s "$pkg"
              echo "::endgroup::"
            done
          done
          # Without this the job passes when there is nothing to fuzz, so
          # deleting every target -- or a refactor that renames the file they
          # live in -- would read as a green fuzz gate. docs/security-hardening.md
          # §6 requires a target on every parser that reads untrusted input, and
          # zero is never the right answer for this repository.
          if [ "$found" -eq 0 ]; then
            echo "::error::no fuzz targets were found; the fuzz gate certified nothing"
            exit 1
          fi
          echo "fuzzed $found target(s)"

  # F-23: the runnable examples are `main` packages with no tests, so the root
  # build covers them only if they live in this module.
  build-examples:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build examples
        run: |
          go build -v ./examples/passkeys
          go vet ./examples/passkeys

  # examples/passkeys in a real Chrome with a virtual authenticator, for both a
  # device-bound key and a synced passkey: registration, autofill sign-in and
  # the sign-in button. The library's own tests build ceremonies with authtest's
  # authenticator; only a browser shows that what PublicKeyCredential.toJSON
  # sends is what the library accepts. The driver (chromedp) lives in the
  # test's own module and never enters the library's dependency graph.
  browser:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: examples/passkeys/e2e/go.mod
          cache-dependency-path: |
            go.sum
            examples/passkeys/e2e/go.sum
      # Google Chrome, not the image's /usr/bin/chromium: Ubuntu 24.04 lets only
      # a browser with an AppArmor profile use unprivileged user namespaces,
      # and only Chrome's install ships one, so Chromium dies with "No usable
      # sandbox!". The sandbox stays on. Without a browser under CI the test
      # fails rather than skips.
      - name: Drive the example in Chrome
        working-directory: examples/passkeys/e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          go vet ./...
          go mod tidy -diff || { echo "::error::run go mod tidy in examples/passkeys/e2e"; exit 1; }
          go test -count=1 -v ./...

  # The authtest conformance suites against a real database: the reference
  # SQLite store in examples/sqlitestore runs FlowStoreSuite and
  # WebAuthnStoreSuite, plus the SQL-specific cases the suites cannot see
  # (time precision and zone, BLOB columns, the conditional updates under
  # concurrent callers). It is its own module, so the driver never enters the
  # library's dependency graph.
  sql-store:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: examples/sqlitestore/go.mod
          cache-dependency-path: |
            go.sum
            examples/sqlitestore/go.sum
      - name: Run the conformance suites on SQLite
        working-directory: examples/sqlitestore
        run: |
          # The module replaces the library with this tree, so a dependency
          # change at the root changes its go.mod too (Renovate tidies both).
          go mod tidy -diff || { echo "::error::run go mod tidy in examples/sqlitestore after changing the root go.mod"; exit 1; }
          go vet ./...
          go test -race -count=1 ./...

  # The squash commit takes the pull request's title (the repository setting
  # in docs/ci.md), and release-please reads that commit to choose the next
  # version and write the changelog. A title it cannot parse is a change the
  # release silently leaves out. The step runs only on pull requests; on a push
  # or a merge group there is no title, and the job passes so ci-gate can.
  pr-title:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The title is a conventional commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! grep -qE "^(${CONVENTIONAL_TYPES})(\([a-z0-9._/,-]+\))?!?: [^ ]" <<<"$TITLE"; then
            echo "::error::write the title as <type>(<scope>)!: <summary>, with a type from release-please-config.json: ${CONVENTIONAL_TYPES//|/, } (GitHub's default 'Revert \"...\"' title needs rewriting as revert: ...)"
            exit 1
          fi

  # Every exported identifier is a promise to the code that imports it. This
  # compares the module's exported API with the pull request's base and puts
  # the difference in the run summary; examples/ is a demonstration, not API.
  #
  # The base is the first parent of the merge commit the job checks out, not
  # the event's base.sha, which goes stale when the base moves after the last
  # push (an `edited` run would blame the pull request for the base's changes).
  # The mode comes from the base's .release-please-manifest.json, so a pull
  # request cannot relax it:
  #   pre-release: an incompatible change without `!` in the title is a warning.
  #   stable:      an incompatible change fails unless the title declares it
  #                with `!` AND the module path moves to its next major (/v3):
  #                release-please would otherwise tag v3.0.0 on module /v2,
  #                which Go refuses.
  api-diff:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        if: github.event_name == 'pull_request'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # x/exp has no releases; the pin is a commit.
      - name: Install apidiff
        if: github.event_name == 'pull_request'
        env:
          APIDIFF_VERSION: v0.0.0-20260908205506-85c1c2202aba
        run: go install "golang.org/x/exp/cmd/apidiff@${APIDIFF_VERSION}"
      - name: Compare the exported API with the base
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse HEAD^1)
          git worktree add --detach "$RUNNER_TEMP/base" "$base_sha"
          head_module=$(go list -m)
          base_module=$(cd "$RUNNER_TEMP/base" && go list -m)
          (cd "$RUNNER_TEMP/base" && apidiff -m -w "$RUNNER_TEMP/base.api" "$base_module")
          apidiff -m -w "$RUNNER_TEMP/head.api" "$head_module"
          not_api='^- (package [^ :]+/examples/|\./examples/)'
          report=$(apidiff -m "$RUNNER_TEMP/base.api" "$RUNNER_TEMP/head.api" | { grep -vE "$not_api" || true; })
          breaking=$(apidiff -m -incompatible "$RUNNER_TEMP/base.api" "$RUNNER_TEMP/head.api" | { grep -vE "$not_api" || true; })
          {
            echo "## Exported API against the base ($base_module at ${base_sha:0:12})"
            echo
            if [ -n "$breaking$(grep -vE '^(Incompatible|Compatible) changes:$' <<<"$report")" ]; then
              fence='```'
              printf '%s\n%s\n%s\n' "$fence" "$report" "$fence"
            else
              echo "No change."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$breaking" ]; then
            exit 0
          fi
          printf '%s\n' "$breaking"
          declared=false
          if grep -qE "^(${CONVENTIONAL_TYPES})(\([a-z0-9._/,-]+\))?!: " <<<"$TITLE"; then
            declared=true
          fi
          version=$(jq -r '."."' "$RUNNER_TEMP/base/.release-please-manifest.json")
          case "$version" in
            *-*)
              if [ "$declared" = true ]; then
                echo "the title declares the incompatible change"
              else
                echo "::warning::incompatible API change not declared with '!' in the title; allowed while the base is at the pre-release $version"
              fi
              ;;
            *)
              if [ "$declared" = true ] && [ "$base_module" != "$head_module" ]; then
                echo "declared, and the module moves from $base_module to $head_module"
              elif [ "$declared" = true ]; then
                echo "::error::the title declares a break, but the module path is still $head_module; a breaking release of a Go module needs its next major path"
                exit 1
              else
                echo "::error::incompatible API change at the stable release $version; keep the old API, or move the module to its next major path and declare the break with '!'"
                exit 1
              fi
              ;;
          esac

  # actionlint (pre-commit) checks that a workflow is valid; zizmor checks that
  # it is safe: template injection, credentials left in a checkout, excessive
  # token scopes, unpinned actions. Offline, so the gate cannot go red on a
  # network failure or an upstream tag move; scheduled.yml runs the online
  # audits nightly.
  workflows:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Audit the workflows with zizmor
        env:
          # renovate: pypi=zizmor
          ZIZMOR_VERSION: 1.30.1
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --offline --format=github .github/workflows/

  release-please:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - id: release-please
        name: Release please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The release PR and its tag belong to the branch that was pushed.
          target-branch: ${{ github.ref_name }}

  # The one check the branch ruleset requires. Requiring each job by name meant
  # every new job was an edit to the ruleset as well as to this file, and a job
  # missing from the ruleset gated nothing while looking like it did. This job
  # passes only when every job it needs succeeded -- a skipped or cancelled job
  # is a failure here, not a pass -- and it refuses to pass when a job in this
  # file is missing from `needs`, so a new job cannot ship ungated.
  ci-gate:
    if: always()
    needs:
      - test
      - checks
      - build
      - govulncheck
      - fuzz
      - build-examples
      - pr-title
      - api-diff
      - workflows
      - browser
      - sql-store
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Every job in this workflow is gated
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # Read first, so a yq that fails or reads nothing fails this step
          # instead of yielding an empty list that gates nothing.
          jobs=$(yq -r '.jobs | keys | .[]' .github/workflows/ci.yml)
          if [ -z "$jobs" ]; then
            echo "::error::ci-gate: could not read the job list of ci.yml"
            exit 1
          fi
          # release-please runs only after a merge, and this job is the gate.
          missing=$(comm -23 \
            <(grep -vxE 'ci-gate|release-please' <<<"$jobs" | sort) \
            <(jq -r 'keys[]' <<<"$NEEDS" | sort))
          if [ -n "$missing" ]; then
            echo "::error::ci-gate: add these jobs to ci-gate's needs: ${missing//$'\n'/ }"
            exit 1
          fi
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<<"$NEEDS"
          bad=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$NEEDS")
          if [ -n "$bad" ]; then
            echo "::error::ci-gate: ${bad//$'\n'/ }"
            exit 1
          fi
