name: scheduled

# The pull-request gate sees the code only when someone opens a pull request.
# Three things change without a commit: an advisory is published against a
# dependency, a fuzz target finds an input that 30 seconds did not reach, and a
# new Go release changes what the toolchain accepts. The nightly run looks for
# all three and opens an issue when it finds one.
#
# GitHub fires `schedule` only on the default branch, and dispatches only a
# workflow whose file also exists there. Until `v2.0.0` the default branch is
# `main`, which carries v1, so `main` holds a file at this same path that
# dispatches this one on `v2` (see docs/ci.md). Once this file is on the
# default branch its own schedule takes over.
#
# Two runs share this file: `nightly` every night and `mutation` every Monday.
# A scheduled event names its run by its cron line; a dispatch names it with
# the `run` input, which defaults to the nightly.
on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      run:
        description: Which scheduled run to start
        type: choice
        options:
          - nightly
          - mutation
        default: nightly

permissions: {}

# One group per run, so a queued mutation run never waits behind, or is
# replaced by, a nightly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.run || github.event.schedule }}
  cancel-in-progress: false

jobs:
  govulncheck:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 3 * * *') || inputs.run == 'nightly'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # A current toolchain, for the reason given in ci.yml's govulncheck job.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Install govulncheck
        env:
          # renovate: go=golang.org/x/vuln
          GOVULNCHECK_VERSION: v1.8.0
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - name: Run govulncheck
        run: govulncheck ./...

  # Repeated, shuffled runs under the race detector, on go.mod's Go and on the
  # newest release. A test that passes once in the gate can still depend on
  # timing or on the order tests run in. Three separate invocations, because
  # -shuffle draws one order per test binary: -count=3 would repeat one order.
  race:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 3 * * *') || inputs.run == 'nightly'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: [go.mod, stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
      - name: Run tests
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            echo "::group::run $run"
            go test -race -count=1 -shuffle=on ./...
            echo "::endgroup::"
          done

  # The gate fuzzes each target for 30 s; this gives each up to ten minutes,
  # inside a 40-minute budget shared by all targets so a new target cannot push
  # the job past its timeout. The generated corpus lives in the build cache's
  # fuzz directory and is carried from night to night, so each run starts where
  # the last one stopped instead of from the seeds. It is saved even when a
  # target fails, and a failing target does not stop the others.
  fuzz:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 3 * * *') || inputs.run == 'nightly'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Locate the fuzz corpus
        id: corpus
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      - name: Restore the fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-corpus-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ github.ref_name }}-
      - name: Fuzz every target
        run: |
          set -euo pipefail
          pairs=()
          for pkg in $(go list ./...); do
            for target in $(go test -list='^Fuzz' "$pkg" | { grep '^Fuzz' || true; }); do
              pairs+=("$pkg $target")
            done
          done
          if [ "${#pairs[@]}" -eq 0 ]; then
            echo "::error::no fuzz targets were found; the fuzz run certified nothing"
            exit 1
          fi
          per=$(( 2400 / ${#pairs[@]} ))
          if [ "$per" -gt 600 ]; then per=600; fi
          failed=()
          for pair in "${pairs[@]}"; do
            read -r pkg target <<<"$pair"
            echo "::group::fuzz $pkg $target for ${per}s"
            if ! go test -run='^$' -fuzz="^${target}$" -fuzztime="${per}s" "$pkg"; then
              failed+=("$target")
            fi
            echo "::endgroup::"
          done
          echo "fuzzed ${#pairs[@]} target(s) for ${per}s each"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::fuzz targets failed: ${failed[*]}"
            exit 1
          fi
      - name: Save the fuzz corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-corpus-${{ github.ref_name }}-${{ github.run_id }}
      # A failing input is written under the package's testdata/fuzz. Committing
      # that file turns it into a regression test that the gate runs.
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-failures-${{ github.run_id }}
          path: "**/testdata/fuzz/**"
          retention-days: 30

  # The PR gate audits the workflows offline, so it cannot go red on a network
  # hiccup or on a change upstream. The online audits run here: an action
  # pinned to a commit that is not in its repository (impostor-commit) and an
  # action version with a published advisory (known-vulnerable-actions).
  # .github/zizmor.yml disables ref-version-mismatch, which fires whenever an
  # upstream moves a `vN` tag before Renovate has bumped the digest.
  workflows:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 3 * * *') || inputs.run == 'nightly'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Audit the workflows with zizmor, online
        env:
          # renovate: pypi=zizmor
          ZIZMOR_VERSION: 1.30.1
          GH_TOKEN: ${{ github.token }}
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --format=github .github/workflows/

  # Coverage says a line ran; mutation testing says a test would notice if it
  # were wrong. gremlins flips one condition or operator at a time in amr and
  # webauthn and reruns the tests; a mutant that survives is a behaviour no
  # test pins. Report-only for now: the summary lists the efficacy and every
  # surviving mutant, and the job fails only if gremlins itself cannot run.
  mutation:
    if: (github.event_name == 'schedule' && github.event.schedule == '41 4 * * 1') || inputs.run == 'mutation'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install gremlins
        env:
          # renovate: go=github.com/go-gremlins/gremlins
          GREMLINS_VERSION: v0.6.0
        run: go install "github.com/go-gremlins/gremlins/cmd/gremlins@${GREMLINS_VERSION}"
      - name: Mutate amr and webauthn
        run: |
          set -euo pipefail
          mkdir -p mutation
          echo "## Mutation testing" >> "$GITHUB_STEP_SUMMARY"
          for pkg in amr webauthn; do
            gremlins unleash --workers=4 "./$pkg" | tee "mutation/$pkg.log"
            {
              echo
              echo "### $pkg"
              echo
              grep -E '^(Killed|Test efficacy|Mutator coverage):' "mutation/$pkg.log" | sed 's/^/- /'
              if grep -q ' LIVED ' "mutation/$pkg.log"; then
                echo
                echo "Surviving mutants:"
                echo
                grep ' LIVED ' "mutation/$pkg.log" | sed 's/^ */- /'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-${{ github.run_id }}
          path: mutation/
          retention-days: 90

  # A red scheduled run notifies nobody by default: it is started by a bot, not
  # by a person GitHub would email. One open issue per run and branch collects
  # the failures: the first opens it, later ones comment on it, and closing it
  # once the cause is fixed re-arms it. A job that hits its timeout ends `cancelled`,
  # not `failure`, so that counts too; a run someone cancels by hand does not.
  report:
    needs:
      - govulncheck
      - race
      - fuzz
      - workflows
      - mutation
    if: ${{ !cancelled() && (failure() || contains(needs.*.result, 'cancelled')) }}
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN: ${{ (github.event_name == 'schedule' && github.event.schedule == '41 4 * * 1' && 'mutation') || inputs.run || 'nightly' }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="${RUN}: failing on ${BRANCH}"
          failed=$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key)=\(.value.result)"] | join(", ")' <<<"$NEEDS")
          body="Failed: ${failed}. Run: ${RUN_URL}"
          number=$(gh issue list --state open --search "\"${title}\" in:title" --json number,title \
            | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
